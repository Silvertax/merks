name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Without the signing secrets the APK is built with a throwaway debug key.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merks.jks"
          echo "MERKS_KEYSTORE=$RUNNER_TEMP/merks.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MERKS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MERKS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MERKS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk merks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: merks-apk
          path: merks.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" merks.apk --generate-notes
