name: Build

on:
  push:
    branches: [main]
    # "v0.5.2" is the usual form; "0.5.2" works too.
    tags: ["v*", "[0-9]*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the release notes.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21: the simulated Android 15 in the tests needs it; the app itself still targets Java 17.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # A release tag must match the version inside the app, otherwise the update notice lies.
      - name: Check tag against app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version. Use the tag v$version."
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no section for $version; the release notes list the commit messages instead."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Without the signing secrets the APK is built with a throwaway debug key.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merks.jks"
          echo "MERKS_KEYSTORE=$RUNNER_TEMP/merks.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MERKS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MERKS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MERKS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk merks.apk

      # A release must carry the real key, otherwise it does not install over the app people have.
      - name: Check release signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs merks.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          expected=$(tr -d '[:space:]' < .github/release-cert.sha256)
          if [ "$cert" != "$expected" ]; then
            echo "::error::merks.apk is signed with $cert, not with the release key $expected. Check the signing secrets."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: merks-apk
          path: merks.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Works for a pushed tag and for a release drafted in the GitHub UI.
        run: |
          bash .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" merks.apk --clobber
            # Fill in title and description when they were left empty in the GitHub UI.
            name=$(gh release view "$GITHUB_REF_NAME" --json name --jq .name)
            if [ -z "$name" ] || [ "$name" = "$GITHUB_REF_NAME" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "Merk's ${GITHUB_REF_NAME#v}"
            fi
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" merks.apk --title "Merk's ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
